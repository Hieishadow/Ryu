name: Ryujinx Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup.NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'preview'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret, will build unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/ryubing.keystore
          ls -lh $RUNNER_TEMP/ryubing.keystore

      - name: Publish Release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RYU_KEY_PASS: ${{ secrets.KEY_PASS }}
          RYU_STORE_PASS: ${{ secrets.STORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Building unsigned APK"
            dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj \
              -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk
          else
            echo "Building signed APK"
            dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj \
              -c Release -f net10.0-android -r android-arm64 --no-restore \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=$RUNNER_TEMP/ryubing.keystore \
              -p:AndroidSigningKeyAlias=$KEY_ALIAS \
              -p:AndroidSigningKeyPass=$RYU_KEY_PASS \
              -p:AndroidSigningStorePass=$RYU_STORE_PASS \
              -p:AndroidPackageFormat=apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryujinx-APK-MASTER-RELEASE
          path: src/Ryujinx.Android/bin/Release/net10.0-android/android-arm64/publish/*.apk
          if-no-files-found: error
          retention-days: 30
