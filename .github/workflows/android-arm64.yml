name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryubing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Clean
        run: rm -rf release && mkdir -p release

      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64

      - name: Publish
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RYU_KEY_PASS: ${{ secrets.KEY_PASS }}
          RYU_STORE_PASS: ${{ secrets.STORE_PASS }}
        run: |
          ARGS="src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false"
          if [ -z "$KEYSTORE_BASE64" ]; then
            dotnet publish $ARGS
          else
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/ryubing.keystore
            dotnet publish $ARGS -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/ryubing.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=$RYU_KEY_PASS -p:AndroidSigningStorePass=$RYU_STORE_PASS
          fi

      - name: Select ONE APK - FIX 4 APKs
        run: |
          echo "=== TODOS ==="
          find src/Ryujinx.Android/bin/Release -name "*.apk" -exec ls -lh {} \;

          # Pega o Signed (150MB)
          APK=$(find src/Ryujinx.Android/bin/Release -name "*-Signed.apk" | head -n 1)

          # Fallback: maior arquivo
          if [ -z "$APK" ]; then
            APK=$(find src/Ryujinx.Android/bin/Release -name "*.apk" -printf "%s %p\n" | sort -nr | head -n1 | cut -d' ' -f2-)
          fi

          echo "ESCOLHIDO: $APK"
          cp "$APK" release/Ryubing-Android-ARM64-#${{ github.run_number }}.apk
          ls -lh release/

      - name: Upload ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK-#${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
