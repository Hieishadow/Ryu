name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NUGET_AUDIT: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/workloads
          key: ryubing-${{ hashFiles('**/*.csproj') }}-v2

      - name: Fix feeds - VOLTA PROS 3 MIN
        run: |
          find. -name "NuGet.Config" -o -name "nuget.config" | head -20
          find. -name "NuGet.Config" -o -name "nuget.config" | xargs sed -i '/ryujinx.app/d' 2>/dev/null || true
          find. -name "NuGet.Config" -o -name "nuget.config" | xargs sed -i '/Ryujinx/d' 2>/dev/null || true
          dotnet nuget list source || true
          dotnet workload install android --skip-sign-check

      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64 --ignore-failed-sources

      - name: Publish APK
        run: |
          rm -rf release && mkdir release
          dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false -p:AndroidUseAssemblyStore=false
          APK=$(find src -name "*-Signed.apk" | head -n1)
          [ -z "$APK" ] && APK=$(find src -name "*.apk" | sort -r | head -n1)
          cp "$APK" release/Ryubing-ARM64-${{ github.run_number }}.apk
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK
          path: release/*.apk
