name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_NUGET_AUDIT: false
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fix submodules
        run: git submodule update --init --recursive --force

      - name: Patch Nvdec + Audio backends
        run: |
          echo "=== Patch Nvdec ==="
          sed -i '/Ryujinx.Graphics.Nvdec/d' src/Ryujinx.HLE/Ryujinx.HLE.csproj || true
          sed -i '/Ryujinx.Graphics.Nvdec/d' src/Ryujinx.Graphics.Gpu/Ryujinx.Graphics.Gpu.csproj || true
          sed -i '/Ryujinx.Graphics.Nvdec/d' src/Ryujinx.Android/Ryujinx.Android.csproj || true

          echo "=== Patch Audio ==="
          sed -i '/Audio.Backends.Dummy/d' src/Ryujinx.Android/Ryujinx.Android.csproj || true
          sed -i '/Audio.Backends.OpenAl/d' src/Ryujinx.Android/Ryujinx.Android.csproj || true
          sed -i '/Audio.Backends.SDL2/d' src/Ryujinx.Android/Ryujinx.Android.csproj || true

          echo "=== Refs after patch ==="
          grep -n "ProjectReference" src/Ryujinx.Android/Ryujinx.Android.csproj || true
          grep -n "Nvdec" src/Ryujinx.HLE/Ryujinx.HLE.csproj || echo "Nvdec removido de HLE"
          grep -n "Nvdec" src/Ryujinx.Graphics.Gpu/Ryujinx.Graphics.Gpu.csproj || echo "Nvdec removido de Gpu"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Restore Android
        run: |
          dotnet restore \
            src/Ryujinx.Android/Ryujinx.Android.csproj \
            --ignore-failed-sources \
            /p:NuGetAudit=false \
            /p:RunAnalyzersDuringBuild=false

      - name: Publish ARM64 APK
        run: |
          dotnet publish \
            src/Ryujinx.Android/Ryujinx.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:RunAOTCompilation=false \
            -p:AndroidUseAssemblyStore=false \
            -p:NuGetAudit=false \
            -p:RunAnalyzersDuringBuild=false \
            --ignore-failed-sources

      - name: Select ONE APK
        run: |
          echo "=== APKs GERADAS ==="
          find src/Ryujinx.Android/bin/Release -type f -name "*.apk" -exec ls -lh {} \;
          APK=$(find src/Ryujinx.Android/bin/Release -type f -name "*-Signed.apk" -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find src/Ryujinx.Android/bin/Release -type f -name "*.apk" -print -quit)
          fi
          if [ -z "$APK" ]; then
            echo "ERRO: nenhuma APK encontrada."
            exit 1
          fi
          echo "APK escolhida: $APK"
          mkdir -p release
          cp "$APK" "release/Ryubing-Android-ARM64-#${{ github.run_number }}.apk"
          ls -lh release/

      - name: Upload ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK-#${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
