name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryubing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NUGET_AUDIT: false
      DOTNET_NUGET_SIGNATURE_VERIFICATION: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fix submodules
        run: git submodule update --init --recursive --force

      - name: Setup.NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/workloads
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}-v8
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Android workload + NuGet
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="libhac" value="https://legacy.git.ryujinx.app/api/v4/projects/17/packages/nuget/index.json" />
              <add key="ryujinx-deps" value="https://legacy.git.ryujinx.app/api/v4/projects/71/packages/nuget/index.json" />
              <add key="git.ryujinx.app" value="https://api.packages.ryujinx.app/nuget/index.json" />
            </packageSources>
          </configuration>
          EOF
          rm -f NuGet.Config src/NuGet.Config src/nuget.config || true
          cp nuget.config NuGet.Config
          dotnet workload install android --skip-sign-check

      - name: Clean
        run: rm -rf release && mkdir -p release

      - name: Restore
        run: |
          SLN=$(find. -maxdepth 3 -name "*.sln" | head -n1)
          echo "SLN: $SLN"
          dotnet restore "$SLN" --ignore-failed-sources /p:NuGetAudit=false /p:RunAnalyzersDuringBuild=false

      - name: Publish ARM64 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RYU_KEY_PASS: ${{ secrets.KEY_PASS }}
          RYU_STORE_PASS: ${{ secrets.STORE_PASS }}
        run: |
          ARGS="src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false -p:AndroidUseAssemblyStore=false -p:NuGetAudit=false -p:RunAnalyzersDuringBuild=false"
          if [ -z "$KEYSTORE_BASE64" ]; then
            dotnet publish $ARGS --ignore-failed-sources
          else
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/ryubing.keystore
            dotnet publish $ARGS -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/ryubing.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=$RYU_KEY_PASS -p:AndroidSigningStorePass=$RYU_STORE_PASS --ignore-failed-sources
          fi

      - name: Select ONE APK
        run: |
          find src/Ryujinx.Android/bin/Release -name "*.apk" -exec ls -lh {} \;
          APK=$(find src/Ryujinx.Android/bin/Release -name "*-Signed.apk" | head -n1)
          if [ -z "$APK" ]; then APK=$(find src/Ryujinx.Android/bin/Release -name "*.apk" -printf "%s %p\n" | sort -nr | head -n1 | cut -d' ' -f2-); fi
          cp "$APK" "release/Ryubing-Android-ARM64-#${{ github.run_number }}.apk"
          ls -lh release/

      - name: Upload ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK-#${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
