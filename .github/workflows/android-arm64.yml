name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NUGET_AUDIT: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/workloads
          key: ryubing-${{ hashFiles('**/*.csproj') }}-v5

      - name: Fix nuget.config
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="libhac" value="https://legacy.git.ryujinx.app/api/v4/projects/17/packages/nuget/index.json" />
              <add key="ryujinx-deps" value="https://legacy.git.ryujinx.app/api/v4/projects/71/packages/nuget/index.json" />
            </packageSources>
            <config>
              <add key="http-request-timeout" value="300000" />
            </config>
          </configuration>
          EOF
          rm -f NuGet.Config src/NuGet.Config src/nuget.config || true
          cp nuget.config NuGet.Config
          cat nuget.config
          dotnet nuget list source
          dotnet workload install android --skip-sign-check

      - name: Restore
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Tentativa $i/5 ==="
            dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64 --disable-parallel /p:NuGetAudit=false /p:RunAnalyzersDuringBuild=false /p:RestoreDisableParallel=true && break
            echo "Deu timeout, esperando 45s..."
            sleep 45
          done

      - name: Publish APK
        run: |
          rm -rf release && mkdir release
          dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false -p:AndroidUseAssemblyStore=false
          APK=$(find src -name "*-Signed.apk" | head -n1)
          [ -z "$APK" ] && APK=$(find src -name "*.apk" | sort -r | head -n1)
          cp "$APK" release/Ryubing-ARM64-${{ github.run_number }}.apk
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK
          path: release/*.apk
