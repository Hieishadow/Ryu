name: Ryujinx Android ARM64
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup.NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64
      - name: Build 280MB Release
        run: dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -r android-arm64 --no-restore
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ryujinx-APK-MASTER-RELEASE
          path: "**/*.apk"
