name: Ryubing Android ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryubing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ~/.dotnet/workloads
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}-${{ hashFiles('**/WorkloadManifest.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Clean
        run: |
          rm -rf release
          mkdir -p release
          # NÃO apaga mais bin/obj do Vulkan - é isso que deixava lento

      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64

      - name: Version
        run: |
          sed -i "s/#529/#${{ github.run_number }}/g" src/Ryujinx.Android/Properties/AndroidManifest.xml || true
          sed -i "s/529/${{ github.run_number }}/g" src/Ryujinx.Android/MainActivity.cs || true
          sed -i "s/S20 FE.*/S20 FE #${{ github.run_number }}/g" src/Ryujinx.Android/MainActivity.cs || true

      - name: Build APK FAST
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
        run: |
          # FAST = sem AOT, pra testar Present CALLED. Final tira essa linha.
          ARGS="src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false -p:AndroidEnableProfiledAot=false"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ryubing.keystore"
            ARGS="$ARGS -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/ryubing.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=$KEY_PASS -p:AndroidSigningStorePass=$STORE_PASS"
          fi

          dotnet publish $ARGS

      - name: Get APK
        run: |
          APK=$(find src/Ryujinx.Android/bin/Release -type f -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find src/Ryujinx.Android/bin/Release -type f -name "*.apk" -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi
          test -n "$APK"
          cp "$APK" "release/Ryubing-Android-ARM64-#${{ github.run_number }}.apk"
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryubing-APK-#${{ github.run_number }}
          path: release/*.apk
          retention-days: 14
