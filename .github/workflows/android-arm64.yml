name: Ryujinx Android ARM64
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup.NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Ryujinx.Android/Ryujinx.Android.csproj -r android-arm64
      - name: Build GORDA Release NAO CRASHA
        run: dotnet publish src/Ryujinx.Android/Ryujinx.Android.csproj -c Release -r android-arm64 --no-restore -p:AndroidPackageFormat=apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ryujinx-APK-MASTER-GORDA-200MB
          path: "**/bin/Release/**/publish/*.apk"
