name: Linux ARM64 AppImage

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  appimage:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Ryujinx linux-arm64
        run: |
          dotnet publish src/Ryujinx -c Release -r linux-arm64 \
            --self-contained true /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish

      - name: Build AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          mkdir -p AppDir/usr/bin
          cp -r publish/* AppDir/usr/bin/
          
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=0
          exec "$HERE/usr/bin/Ryujinx" "$@"
          EOF
          chmod +x AppDir/AppRun

          # pega o .desktop e ícone que já existem no seu repo
          cp distribution/linux/Ryujinx.desktop AppDir/ 2>/dev/null || \
          echo -e "[Desktop Entry]\nName=Ryu\nExec=Ryujinx\nIcon=ryujinx\nType=Application\nCategories=Game;" > AppDir/Ryujinx.desktop
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
          cp -v assets/*.png AppDir/ 2>/dev/null; cp -v assets/*.png AppDir/usr/share/icons/hicolor/256x256/apps/ 2>/dev/null || true

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage
          ./appimagetool-aarch64.AppImage AppDir Ryu-linux-arm64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-linux-arm64-AppImage
          path: Ryu-linux-arm64.AppImage
